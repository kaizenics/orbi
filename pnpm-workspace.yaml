packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  better-sqlite3: false # ships N-API prebuilds; no compile step needed
  esbuild: true

# Versions shared by more than one workspace package. Reference with "catalog:".
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": 26.6.6
  typescript: 7.0.2
  zod: 4.6.7
  "@tanstack/react-query": 5.107.1
  hono: 4.13.17
  vitest: 5.1.0
  eslint: 10.9.1
  tailwindcss: 4.3.5
  "@tailwindcss/postcss": 4.3.5

minimumReleaseAgeExclude:
  - maplibre-gl@6.17.0
